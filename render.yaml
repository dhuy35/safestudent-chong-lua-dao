services:
  - type: web
    name: safestudent-chong-lua-dao-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: LOG_WEBHOOK_URL
        sync: false
      - key: LOG_WEBHOOK_SECRET
        sync: false
      - key: NODE_ENV
        value: production
