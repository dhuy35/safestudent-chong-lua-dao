services:
  - type: web
    name: safestudent-chong-lua-dao-ai
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: NODE_ENV
        value: production
